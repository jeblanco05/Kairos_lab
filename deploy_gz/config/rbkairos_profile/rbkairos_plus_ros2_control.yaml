---
/**:

  robotnik_base_control:
    ros__parameters:
      use_stamped_vel: false
      # Joint names
      front_left_wheel_command_joint_name: robot_front_left_wheel_joint
      front_right_wheel_command_joint_name: robot_front_right_wheel_joint
      rear_left_wheel_command_joint_name: robot_back_left_wheel_joint
      rear_right_wheel_command_joint_name: robot_back_right_wheel_joint

      # Kinematics
      kinematics:
        wheels_radius: 0.11
        sum_of_robot_center_projection_on_X_Y_axis: 0.464

      linear:
        x:
          has_velocity_limits: true
          max_velocity: 1.0
          min_velocity: -1.0
          has_acceleration_limits: true
          max_acceleration: 1.5
          min_acceleration: -3.0
        y:
          has_velocity_limits: true
          max_velocity: 1.0
          min_velocity: -1.0
          has_acceleration_limits: true
          max_acceleration: 1.5
          min_acceleration: -3.0
      angular:
        z:
          has_velocity_limits: true
          max_velocity: 1.5
          min_velocity: -1.5
          has_acceleration_limits: true
          max_acceleration: 7.5
          min_acceleration: -7.5

      # Odometry
      odom_frame_id: robot_odom
      base_frame_id: robot_base_footprint
      enable_odom_tf: true
      tf_frame_prefix_enable: false

      reference_timeout: 2.0
      publish_rate: 50.0

  # HAS ARM
  joint_trajectory_controller:
    ros__parameters:
      publish_rate: 50
      joints:
        - robot_arm_shoulder_pan_joint
        - robot_arm_shoulder_lift_joint
        - robot_arm_elbow_joint
        - robot_arm_wrist_1_joint
        - robot_arm_wrist_2_joint
        - robot_arm_wrist_3_joint

      command_interfaces:
        - position

      state_interfaces:
        - position
        - velocity

      state_publish_rate: 50.0
      action_monitor_rate: 20.0

      allow_partial_joints_goal: false
      open_loop_control: true

  qbhand_synergy_controller:
    ros__parameters:
      joints:
        - qbhand_synergy_joint
      interface_name: position

  rg6_gripper_controller:
    ros__parameters:
      joints:
        - rg6_left_finger_joint
      interface_name: position

