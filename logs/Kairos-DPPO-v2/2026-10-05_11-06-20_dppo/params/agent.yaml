seed: 42
device: cuda:0
num_steps_per_env: 24
max_iterations: 4000
empirical_normalization: false
obs_groups:
  policy:
  - obs_noised
  - history
  teacher:
  - obs_noised
  - obs_priv
  critic:
  - obs
  - obs_priv
clip_actions: null
save_interval: 500
experiment_name: Kairos-DPPO-v2
run_name: ''
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: false
load_run: my_projects/Kairos_lab/logs/Kairos-PPO-v2/2026-09-25_02-55-05
load_checkpoint: '-1'
class_name: DPPORunner
policy:
  class_name: StudentTeacherLatentDPPO
  init_noise_std: 0.05
  noise_std_type: scalar
  student_obs_normalization: false
  teacher_obs_normalization: false
  critic_obs_normalization: false
  latent_dim: 8
  actor_hidden_dims:
  - 256
  - 128
  - 64
  critic_hidden_dims:
  - 512
  - 256
  activation: elu
  lateral_teacher_hidden_dims:
  - 128
  - 64
  lateral_net_type: tcn
  lateral_student_hidden_dims:
  - 512
  - 256
  - 128
  num_history_frames: 80
  tcn_mlp_hidden_dim: 256
  tcn_mlp_out_dim: 32
  tcn_conv_layers:
  - - 32
    - 32
    - 8
    - 4
  - - 32
    - 32
    - 5
    - 1
  - - 32
    - 32
    - 5
    - 1
  freeze_actor_base_steps: 500
  freeze_lateral_net_steps: -500
  freeze_critic_steps: -1
algorithm:
  class_name: DPPO
  num_learning_epochs: 6
  num_mini_batches: 4
  learning_rate: 0.0005063169358053299
  schedule: adaptive
  gamma: 0.9819023007941059
  lam: 0.9068786393155833
  entropy_coef: 0.009052066070652268
  desired_kl: 0.01
  max_grad_norm: 1.0
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.1817208507534304
  normalize_advantage_per_mini_batch: false
  distillation_loss_coef: 0.5
  ppo_loss_coef: 0.5
  latent_distillation_coef: 0.2
  distillation_loss_type: mse
