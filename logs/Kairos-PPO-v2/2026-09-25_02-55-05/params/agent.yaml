seed: 42
device: cuda:0
num_steps_per_env: 24
max_iterations: 10000
empirical_normalization: false
obs_groups:
  policy:
  - obs_noised
  - obs_priv
  critic:
  - obs
  - obs_priv
clip_actions: null
save_interval: 1000
experiment_name: Kairos-PPO-v2
run_name: ''
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: false
load_run: .*
load_checkpoint: model_.*.pt
class_name: OnPolicyRunner
policy:
  class_name: ActorCriticLatent
  init_noise_std: 1.0
  noise_std_type: scalar
  state_dependent_std: false
  actor_obs_normalization: {}
  critic_obs_normalization: {}
  actor_hidden_dims:
  - 256
  - 128
  - 64
  critic_hidden_dims:
  - 512
  - 256
  activation: elu
  latent_dim: 8
  lateral_hidden_dims:
  - 128
  - 64
algorithm:
  class_name: PPO
  num_learning_epochs: 6
  num_mini_batches: 4
  learning_rate: 0.0005063169358053299
  schedule: adaptive
  gamma: 0.9819023007941059
  lam: 0.9068786393155833
  entropy_coef: 0.009052066070652268
  desired_kl: 0.01
  max_grad_norm: 1.0
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.1817208507534304
  normalize_advantage_per_mini_batch: false
  rnd_cfg: null
  symmetry_cfg: null
